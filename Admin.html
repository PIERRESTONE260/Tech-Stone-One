<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centre de Contrôle Admin | Tech-Stone One</title>
    <meta name="description" content="Panneau d'administration sécurisé pour la direction de Tech-Stone One.">
    <meta name="theme-color" content="#060b13">
    <link rel="shortcut icon" href="logo.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="ts1-ui.css">
</head>
<body>

    <div id="app">
        <!-- Le bouton hamburger mobile -->
        <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <!-- L'application d'administration sera injectée dynamiquement ici par admin.js après authentification -->
        <div class="auth-wrap">
            <div class="auth-card">
                <div class="brand">
                    <img src="logo.svg" alt="" width="38" height="38">
                    <strong>Chargement de l'administration...</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Bibliothèques et scripts principaux -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="ts1-core.js"></script>
    <script src="admin.js"></script>
</body>
</html>
