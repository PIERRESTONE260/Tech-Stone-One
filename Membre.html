<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-Stone One - Espace Membre & Collaboratif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --dark: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--dark); color: var(--text); padding: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        header h1 { color: var(--primary); font-size: 1.5rem; }
        .btn-meeting { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        h3 { margin-bottom: 15px; color: var(--secondary); display: flex; align-items: center; gap: 10px; }
        ul { list-style: none; }
        li { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white; margin-bottom: 10px; }
        button { background: var(--primary); color: var(--dark); border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-code"></i> Espace Collaboratif — Tech-Stone One</h1>
        <a href="meeting.html" class="btn-meeting" target="_blank"><i class="fa-solid fa-video"></i> Rejoindre la Salle de Réunion Live</a>
    </header>

    <div class="grid">
        <div class="card">
            <h3><i class="fa-solid fa-list-check"></i> Projets & Tâches en Cours</h3>
            <div id="user-projects"></div>
            <div style="margin-top: 15px;">
                <input type="text" id="new-task" placeholder="Ajouter une note ou tâche rapide..." style="width:100%; padding:8px; background:#0f172a; border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:white; margin-bottom:8px;">
                <button onclick="addTask()">Ajouter</button>
            </div>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-bullhorn"></i> Actualités de l'Entreprise</h3>
            <div id="user-news">Chargement...</div>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-book-open"></i> Manuel Interne & Directives</h3>
            <p id="user-manual" style="white-space: pre-line; color:#94a3b8; font-size: 0.95rem;"></p>
        </div>
    </div>

    <script>
        function loadDashboard() {
            // Actualités
            const news = JSON.parse(localStorage.getItem('ts_news')) || [];
            document.getElementById('user-news').innerHTML = news.map(n => `<p style="margin-bottom:10px;"><strong>${n.title}</strong><br><small style="color:#94a3b8">${n.content}</small></p>`).join('') || 'Aucune actualité récente.';

            // Manuel
            document.getElementById('user-manual').innerText = localStorage.getItem('ts_manual') || 'Aucune directive renseignée pour le moment.';

            // Tâches
            const tasks = JSON.parse(localStorage.getItem('ts_tasks')) || [];
            document.getElementById('user-projects').innerHTML = tasks.map((t, index) => `<li style="display:flex; justify-content:space-between; align-items:center;">${t} <button onclick="deleteTask(${index})" style="background:#ef4444; color:white; padding:3px 8px; font-size:0.8rem;">×</button></li>`).join('') || '<p style="color:#64748b">Aucune tâche enregistrée.</p>';
        }

        function addTask() {
            const val = document.getElementById('new-task').value;
            if(!val) return;
            let tasks = JSON.parse(localStorage.getItem('ts_tasks')) || [];
            tasks.push(val);
            localStorage.setItem('ts_tasks', JSON.stringify(tasks));
            document.getElementById('new-task').value = '';
            loadDashboard();
        }

        function deleteTask(index) {
            let tasks = JSON.parse(localStorage.getItem('ts_tasks')) || [];
            tasks.splice(index, 1);
            localStorage.setItem('ts_tasks', JSON.stringify(tasks));
            loadDashboard();
        }

        loadDashboard();
    </script>
</body>
</html>
